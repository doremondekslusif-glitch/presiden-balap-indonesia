<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Presiden Balap Indonesia — Bali Circuit</title>
  <link rel="stylesheet" href="./src/style.css"/>
</head>

<body>
  <main id="app">

    <!-- HUD BALAP -->
    <div id="hud" class="hud hidden">
      <section class="race-card position">
        <span>POSISI</span>
        <strong id="position">1<small>/4</small></strong>
        <b id="racer-name">Garuda Muda</b>
      </section>

      <section class="race-card timing">
        <span>WAKTU</span>
        <strong id="timer">00:00.000</strong>
        <b id="lap">LAP 1/3</b>
      </section>

      <section class="speed">
        <span id="speed">000</span>
        <small>KM/H</small>

        <div class="boost">
          <i id="boost-fill"></i>
          <b>BOOST</b>
        </div>
      </section>

      <section class="minimap">
        <canvas id="map" width="170" height="130"></canvas>
        <b>BALI CIRCUIT</b>
      </section>

      <div id="countdown" class="countdown"></div>
    </div>

    <!-- HOME / MAIN MENU -->
    <section id="menu" class="screen">
      <div class="panel">
        <p class="eyebrow">SELAMAT DATANG DI</p>

        <h1>
          PRESIDEN<br/>
          <em>BALAP INDONESIA</em>
        </h1>

        <p class="sub">
          Bali Circuit · 3D arcade racing
        </p>

        <div class="controls">
          <b>KEMUDI</b>
          <span>WASD / Tombol Panah</span>

          <b>BOOST</b>
          <span>Shift atau Spasi</span>

          <b>REM / MUNDUR</b>
          <span>S / Panah Bawah</span>
        </div>

        <div class="menu-actions">
          <button id="start">
            MULAI BALAP
          </button>

          <button id="choose-character" class="secondary">
            PILIH KARAKTER
          </button>

          <button id="choose-circuit" class="secondary">
            PILIH SIRKUIT
          </button>

          <button id="settings" class="secondary">
            PENGATURAN
          </button>
        </div>
      </div>
    </section>

    <!-- CHARACTER SELECT -->
    <section id="character-select" class="screen hidden">
      <div class="panel">
        <p class="eyebrow">PILIH PEMBALAP</p>

        <h2>KARAKTER</h2>

        <div
          id="character-cards"
          class="character-cards">
        </div>

        <button
          id="character-back"
          class="secondary">
          KEMBALI
        </button>
      </div>
    </section>

    <!-- RESULT -->
    <section id="results" class="screen hidden">
      <div class="panel results">
        <p class="eyebrow">BALAPAN SELESAI</p>

        <h2>HASIL BALI CIRCUIT</h2>

        <ol id="result-list"></ol>

        <button id="restart">
          BALAP LAGI
        </button>
      </div>
    </section>

  </main>

  <!-- THREE.JS -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script
    type="module"
    src="./src/main.js">
  </script>
</body>
</html>
